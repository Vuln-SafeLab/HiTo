# HiTo 公网入口：限速 + 慢速攻击防护 + 可信 XFF
# CC/应用层 DDoS 的第一道防线在反代层，不要把应用端口直接发布到公网。

limit_req_zone $binary_remote_addr zone=hito_perip:10m rate=20r/s;

server {
    listen 80;
    server_name _;

    client_header_timeout 5s;   # 杀 Slowloris（半开请求头占连接）
    client_body_timeout   10s;
    send_timeout          15s;
    client_max_body_size  12m;   # 覆盖导入功能上限(5MB)与上传(2MB)

    # 应用按 TRUST_PROXY=true 取 XFF 最右段：这里覆写而非追加，
    # 客户端伪造的段被丢弃，限流/封禁/IP 审计口径全部真实
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        limit_req zone=hito_perip burst=40 nodelay;
        proxy_pass http://app:3000;
        proxy_read_timeout 15s;
    }

    # 写接口单独收紧（登录爆破 / 点击欺诈的高价值目标）
    location /api/auth/ { 
        limit_req zone=hito_perip burst=5 nodelay;
        proxy_pass http://app:3000;
    }
    location /api/track/ {
        limit_req zone=hito_perip burst=10 nodelay;
        proxy_pass http://app:3000;
    }
}
