<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    HiTo 品牌图标 · 「信标」Beacon（原创设计）
    ─────────────────────────────────────────────
    设计语言（参考圆形徽章构图，原创图形）：
    · 深空蓝紫实心圆盘 + 左下对话气泡尾巴 → 「Hi」的问候感（聊天气泡）
    · 盘内右下青色节点(起点) 经白色斜向引线 指向左上紫色空心环(终点)，
      引线末端带箭头 → 「To」的指向性 + 导航站「连接两个节点」的核心意象
    · 16px 下仍可辨识：气泡轮廓 + 高对比对角亮线 + 端点亮块
    配色与站点 liquid-glass 深色视觉协调：
      盘面 #1B2438 / 引线 #F1F5FB / 起点节点 #34D3EE / 终点环 #B18CFF
  -->
  <!-- 对话气泡盘面（圆 + 左下尾巴） -->
  <circle cx="512" cy="500" r="462" fill="#1B2438"/>
  <path d="M 250 850 L 175 960 L 380 908 Z" fill="#1B2438"/>

  <!-- 引线：起点节点 → 终点环（白色，圆帽粗线） -->
  <line x1="392" y1="640" x2="618" y2="404" stroke="#F1F5FB" stroke-width="112" stroke-linecap="round"/>

  <!-- 箭头（在终点环入口处，指向左上） -->
  <path d="M 470 372 L 594 348 L 556 466 Z" fill="#F1F5FB"/>

  <!-- 起点节点：青色实心 -->
  <circle cx="368" cy="668" r="104" fill="#34D3EE"/>

  <!-- 终点：紫色空心环（目标） -->
  <circle cx="662" cy="344" r="126" fill="none" stroke="#B18CFF" stroke-width="98"/>
</svg>
